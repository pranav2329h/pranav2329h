<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Journey: Oct 2023 Hello, GitHub; Oct 2025 SalesPulse AI; Jan 2026 Credisure; May 2026 TensorTonic Solutions; Jun 2026 CloudVault Pro; Oct 2026 Jenkins Auto-Rollback; TODAY Now"><title>Journey: Oct 2023 Hello, GitHub; Oct 2025 SalesPulse AI; Jan 2026 Credisure; May 2026 TensorTonic Solutions; Jun 2026 CloudVault Pro; Oct 2026 Jenkins Auto-Rollback; TODAY Now</title>
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.33" stop-color="#A78BFA"/><stop offset="0.66" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="axis" x1="160" x2="1040" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.date{font:700 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:2px}
.title{font:800 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#E6EDF3}
.sub{font:500 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8B949E}
@keyframes draw{from{stroke-dashoffset:880}to{stroke-dashoffset:0}}
.line{stroke-dasharray:880;animation:draw 3.2s cubic-bezier(.45,0,.25,1) .3s both}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.25)}100%{opacity:1;transform:none}}
.node{transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(var(--d))}to{opacity:1;transform:none}}
.lab{animation:rise .7s ease-out both}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
</style>
