<circle r="6" fill="#22D3EE" filter="url(#glow)" opacity="0"><set attributeName="opacity" to="1" begin="3.7s"/><animateMotion path="M160 162 H1040" dur="4s" begin="3.7s" repeatCount="indefinite"/></circle>
<line x1="160.0" y1="148" x2="160.0" y2="126" stroke="#30363D" stroke-width="2" stroke-dasharray="3 4"/>
