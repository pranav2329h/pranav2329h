@keyframes asciiFade{0%,24%{opacity:1}32%,100%{opacity:0}}.ascii{animation:asciiFade 14s linear infinite}
@keyframes photoFade{0%,24%{opacity:0}32%,84%{opacity:1}92%,100%{opacity:0}}.photo{animation:photoFade 14s linear infinite}
@keyframes glitch{0%,79.9%{opacity:0;transform:none}80%{opacity:1;transform:translateX(-14px)}81%{transform:translateX(12px)}82%{transform:translateX(-7px)}83%{transform:translateX(9px)}84%,100%{opacity:0;transform:none}}
