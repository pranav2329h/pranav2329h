<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Pranav Hydrabade — Computer Science &amp; AI Engineer"><title>Pranav Hydrabade — Computer Science &amp; AI Engineer</title>
<defs>
<linearGradient id="goldShimmer" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#8C6A1F"/><stop offset="0.35" stop-color="#D4AF37"/><stop offset="0.5" stop-color="#F3D98B"/><stop offset="0.65" stop-color="#D4AF37"/><stop offset="1" stop-color="#8C6A1F"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#D4AF37" stop-opacity="0"/><stop offset="1" stop-color="#D4AF37"/></linearGradient><linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#D4AF37"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.48" r="0.55"><stop offset="0" stop-color="#D4AF37" stop-opacity="0.20"/><stop offset="0.6" stop-color="#D4AF37" stop-opacity="0.04"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2A2418" stroke-width="1"/></pattern>
<radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gridMask"><rect width="1200" height="420" fill="url(#gridFade)"/></mask>
</defs>
<style>
.eyebrow{font:600 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:6px;fill:#D4AF37}
.name{font:400 76px Didot, 'Bodoni 72', 'Bodoni MT', 'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;letter-spacing:10px;fill:url(#goldShimmer)}
.sub{font:500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:7px;fill:#EDE6D6;fill-opacity:.82}
.handle{font:500 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:3px;fill:#8A8475}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.08;transform:translateY(0)}50%{opacity:.9;transform:translateY(-16px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.a1{animation:rise 1s ease-out .1s both}.a2{animation:rise 1.2s ease-out .35s both}
.a3{animation:rise 1s ease-out .8s both}.a4{animation:rise 1s ease-out 1.1s both}
.ring{transform-origin:600.0px 205px;animation:spin 80s linear infinite}
.ring2{transform-origin:600.0px 205px;animation:spin 120s linear infinite reverse}
.p{animation:twinkle 7s ease-in-out infinite}
.dot{animation:pulse 2.4s ease-in-out infinite}
</style>
