<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Jenkins Auto-Rollback — Self-healing deployments"><title>Jenkins Auto-Rollback — Self-healing deployments</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#8C6A1F"/><stop offset="0.35" stop-color="#D4AF37"/><stop offset="0.5" stop-color="#F3D98B"/><stop offset="0.65" stop-color="#D4AF37"/><stop offset="1" stop-color="#8C6A1F"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4AF37" stop-opacity="0.85"/><stop offset="0.45" stop-color="#2A2418"/><stop offset="1" stop-color="#8C6A1F" stop-opacity="0.7"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#D4AF37" stop-opacity="0.16"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#F3D98B" stop-opacity="0"/><stop offset="0.5" stop-color="#F3D98B" stop-opacity="0.9"/><stop offset="1" stop-color="#F3D98B" stop-opacity="0"/></linearGradient>
</defs>
<style>
.kind{font:600 12px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:3.5px;fill:#D4AF37}
.meta{font:500 12px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#8A8475;letter-spacing:1px}
.title{font:400 34px Didot, 'Bodoni 72', 'Bodoni MT', 'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;fill:url(#gold);letter-spacing:.5px}
.tag{font:italic 400 16px Didot, 'Bodoni 72', 'Bodoni MT', 'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;fill:#F3D98B}
.desc{font:400 15.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#EDE6D6;fill-opacity:.82}
.chip{font:500 12px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#EDE6D6}
.cta{font:700 12px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:3px;fill:#D4AF37}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.r{animation:rise .8s ease-out both}
@keyframes sheen{0%{transform:translateX(-200px)}60%,100%{transform:translateX(800px)}}
.sh{animation:sheen 6s ease-in-out 1s infinite}
</style>
<rect x="1" y="1" width="598" height="318" rx="18" fill="#0B0B0F" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="1" y="1" width="598" height="318" rx="18" fill="url(#glow)"/>
<clipPath id="top"><rect x="1" y="0" width="598" height="3"/></clipPath>
<g clip-path="url(#top)"><rect class="sh" x="0" y="0" width="160" height="3" fill="url(#sheen)"/></g>
<g class="r"><text class="kind" x="34" y="48">DEVOPS  ·  CI/CD</text>
</g>
<g class="r" style="animation-delay:.15s"><text class="title" x="34" y="98">Jenkins Auto-Rollback</text>
<text class="tag" x="34" y="126">Self-healing deployments</text></g>
<g class="r" style="animation-delay:.3s">
<text class="desc" x="34" y="164">Builds and pushes tagged Docker images, deploys to EC2,</text>
<text class="desc" x="34" y="187">health-checks the release and restores the last good image</text>
<text class="desc" x="34" y="210">on failure.</text>
</g>
<g class="r" style="animation-delay:.45s">
<rect x="34" y="236" width="77" height="26" rx="13" fill="#111118" stroke="#D4AF37" stroke-opacity="0.35"/>
<text class="chip" x="73" y="253" text-anchor="middle">Jenkins</text>
<rect x="119.19999999999999" y="236" width="70" height="26" rx="13" fill="#111118" stroke="#D4AF37" stroke-opacity="0.35"/>
<text class="chip" x="154" y="253" text-anchor="middle">Docker</text>
<rect x="196.79999999999998" y="236" width="77" height="26" rx="13" fill="#111118" stroke="#D4AF37" stroke-opacity="0.35"/>
<text class="chip" x="235" y="253" text-anchor="middle">AWS EC2</text>
<rect x="282.0" y="236" width="54" height="26" rx="13" fill="#111118" stroke="#D4AF37" stroke-opacity="0.35"/>
<text class="chip" x="309" y="253" text-anchor="middle">Bash</text>
<rect x="344.4" y="236" width="70" height="26" rx="13" fill="#111118" stroke="#D4AF37" stroke-opacity="0.35"/>
<text class="chip" x="379" y="253" text-anchor="middle">Python</text>
</g>
<line x1="34" y1="282" x2="566" y2="282" stroke="#2A2418"/>
<text class="meta" x="34" y="304"><tspan style="fill:#D4AF37">◆</tspan> Shell  ·  updated Oct 2026</text>
<text class="cta" x="566" y="304" text-anchor="end">VIEW REPOSITORY  →</text>
</svg>
