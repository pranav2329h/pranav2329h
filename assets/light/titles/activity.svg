<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Contribution Matrix"><title>Contribution Matrix</title>
<defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#0891B2"/><stop offset="0.33" stop-color="#7C3AED"/><stop offset="0.66" stop-color="#DB2777"/><stop offset="1" stop-color="#0891B2"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="6s" repeatCount="indefinite"/></linearGradient><filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>
.n{font:600 15px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#656D76}
.t{font:800 46px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.5px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-origin:600.0px 0;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes travel{0%,100%{transform:translateX(-124.0px)}50%{transform:translateX(124.0px)}}
.dot{animation:travel 3.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.in{animation:rise .9s ease-out both}
</style>
<text class="n in" x="600.0" y="28" text-anchor="middle"><tspan style="fill:#0891B2">//</tspan> 06 <tspan style="fill:#7C3AED">·</tspan> git log</text>
<text class="t in" x="600.0" y="86" text-anchor="middle" fill="url(#neon)">Contribution Matrix</text>
<rect class="bar" x="470.0" y="108" width="260" height="4" rx="2" fill="url(#neon)"/>
<g class="dot"><circle cx="600.0" cy="110" r="9" fill="#0891B2" opacity=".6" filter="url(#blur)"/><circle cx="600.0" cy="110" r="4" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/></g>
</svg>
