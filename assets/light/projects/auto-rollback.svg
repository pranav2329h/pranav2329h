<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Jenkins Auto-Rollback — Self-healing deployments"><title>Jenkins Auto-Rollback — Self-healing deployments</title>
<defs>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#0891B2"/><stop offset="0.33" stop-color="#7C3AED"/><stop offset="0.66" stop-color="#DB2777"/><stop offset="1" stop-color="#0891B2"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.08"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#D0D7DE"/></pattern>
</defs>
<style>
.kind{font:700 12px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:2px;fill:#0891B2}
.meta{font:600 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#656D76}
.title{font:800 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1F2328}
.tag{font:600 15px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#7C3AED}
.desc{font:400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1F2328;fill-opacity:.82}
.chip{font:600 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#1F2328}
.cta{font:800 13px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:1px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.r{animation:rise .7s ease-out both}
@keyframes trail{to{stroke-dashoffset:-1000}}.trail{animation:trail 5s linear infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}.go{animation:nudge 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 1.6s ease-in-out infinite}
</style>
<rect x="1" y="1" width="598" height="328" rx="16" fill="#FFFFFF"/>
<rect x="1" y="1" width="598" height="328" rx="16" fill="url(#dots)" opacity=".55"/>
<rect x="1" y="1" width="598" height="328" rx="16" fill="url(#glow)"/>
<rect x="1" y="1" width="598" height="328" rx="16" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
<rect class="trail" x="1" y="1" width="598" height="328" rx="16" fill="none" stroke="url(#neon)" stroke-width="2.5" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"/>
<rect x="32" y="34" width="4" height="16" rx="2" fill="url(#neon)"/>
<g class="r"><text class="kind" x="46" y="47">DEVOPS · CI/CD</text>
</g>
<g class="r" style="animation-delay:.12s"><text class="title" x="32" y="96">Jenkins Auto-Rollback</text>
<text class="tag" x="32" y="124"><tspan style="fill:#0891B2">//</tspan> Self-healing deployments</text></g>
<g class="r" style="animation-delay:.24s">
<text class="desc" x="32" y="162">Builds and pushes tagged Docker images, deploys to EC2,</text>
<text class="desc" x="32" y="187">health-checks the release and restores the last good</text>
<text class="desc" x="32" y="212">image on failure.</text>
</g>
<g class="r" style="animation-delay:.36s">
<rect x="32" y="240" width="83" height="28" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text class="chip" x="73" y="259" text-anchor="middle">Jenkins</text>
<rect x="122.69999999999999" y="240" width="75" height="28" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text class="chip" x="160" y="259" text-anchor="middle">Docker</text>
<rect x="205.29999999999998" y="240" width="83" height="28" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text class="chip" x="247" y="259" text-anchor="middle">AWS EC2</text>
<rect x="296.0" y="240" width="58" height="28" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text class="chip" x="325" y="259" text-anchor="middle">Bash</text>
<rect x="362.4" y="240" width="75" height="28" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text class="chip" x="400" y="259" text-anchor="middle">Python</text>
</g>
<line x1="32" y1="288" x2="568" y2="288" stroke="#D0D7DE"/>
<text class="meta" x="32" y="313"><tspan style="fill:#89E051">●</tspan> Shell  ·  updated Oct 2026</text>
<g class="go"><text class="cta" x="568" y="313" text-anchor="end" fill="url(#neon)">VIEW REPO →</text></g>
</svg>
