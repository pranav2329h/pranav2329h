<style>
.pill{font:600 14px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#1F2328}
.core{font:800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.sub{font:600 12px 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#656D76;letter-spacing:3px}
@keyframes dash{to{stroke-dashoffset:-200}}.ring{animation:dash 12s linear infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.glow{transform-origin:600.0px 240.0px;animation:breathe 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:600.0px 240.0px;animation:spin 10s linear infinite}
</style>
